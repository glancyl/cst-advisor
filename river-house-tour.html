:root{
  --navy:#1C2560; --orange:#FF8A00;
  --chrome:#1C2560; --chrome-text:#FFFFFF; --chrome-muted:#C3CBE0; --page:#0f1433;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --chrome:#141B4A; --chrome-muted:#A8AFC6; --page:#0a0e26; color-scheme:dark; } }
:root[data-theme="dark"]{ --chrome:#141B4A; --chrome-muted:#A8AFC6; --page:#0a0e26; color-scheme:dark; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ height:100%; margin:0; }
body{ background:var(--page); color:var(--chrome-text); font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; overflow:hidden; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--chrome); }
.app{ height:100%; display:flex; flex-direction:column; }
header{ display:flex; align-items:center; gap:18px; padding:10px 18px; background:var(--chrome); }
header img{ height:30px; width:auto; display:block; }
.titles{ border-left:1px solid rgba(255,255,255,.25); padding-left:18px; min-width:0; }
.titles h1{ margin:0; font:700 1rem/1.2 Montserrat,system-ui,sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.titles p{ margin:2px 0 0; font-size:.85rem; color:var(--chrome-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#pano{ flex:1; min-height:0; position:relative; }
.dock{ background:var(--chrome); padding:8px 14px 10px; }
.floors{ display:flex; gap:6px; margin-bottom:8px; overflow-x:auto; }
.floors button{ all:unset; cursor:pointer; padding:5px 12px; border-radius:16px; font:600 .9rem "Source Sans 3",system-ui,sans-serif; color:var(--chrome-muted); white-space:nowrap; }
.floors button[aria-pressed="true"]{ background:#fff; color:var(--navy); }
.floors button:hover:not([aria-pressed="true"]){ color:#fff; }
.floors button:focus-visible, .stops button:focus-visible{ outline:2px solid var(--orange); outline-offset:2px; }
.stops{ display:flex; gap:10px; overflow-x:auto; }
.stops button{ all:unset; cursor:pointer; flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:5px 12px 5px 5px; border-radius:8px; border:2px solid transparent; color:#fff; }
.stops button:hover{ background:rgba(255,255,255,.08); }
.stops button[aria-current="true"]{ border-color:var(--orange); background:rgba(255,255,255,.06); }
.stops img{ width:72px; height:48px; object-fit:cover; border-radius:5px; display:block; }
.stops .t{ font-weight:600; font-size:.95rem; white-space:nowrap; }
.hint{ position:absolute; left:50%; top:16px; transform:translateX(-50%); background:rgba(28,37,96,.88); color:#fff; padding:8px 16px; border-radius:20px; font-size:.95rem; z-index:4; pointer-events:none; transition:opacity .6s; white-space:nowrap; }
.hint.gone{ opacity:0; }
/* hotspots: 25% larger than tester (48px -> 60px) */
.pnlm-hotspot-base.go{ width:60px; height:60px; margin:-30px 0 0 -30px; border-radius:50%; background:var(--navy); border:3px solid #fff; box-shadow:0 2px 12px rgba(0,0,0,.45); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.pnlm-hotspot-base.go svg{ width:30px; height:30px; }
.pnlm-hotspot-base.go:hover{ background:var(--orange); }
.pnlm-hotspot-base .lbl{ position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%); background:#fff; color:var(--navy); padding:5px 11px; border-radius:6px; white-space:nowrap; font:600 1rem "Source Sans 3",system-ui,sans-serif; box-shadow:0 2px 8px rgba(0,0,0,.35); pointer-events:none; }
@media (max-width:600px){
  header{ padding:8px 12px; gap:12px; } header img{ height:24px; }
  .titles{ padding-left:12px; } .titles h1{ font-size:.9rem; }
  .stops img{ width:56px; height:38px; } .hint{ font-size:.85rem; }
}
@media (prefers-reduced-motion: reduce){ .hint{ transition:none; } }
</style>

  hs:[[-12,180,"office-2c","Back",0]]},
 {id:"stairs-23", f:2, title:"Stairs to 3rd floor", img:"rh-stairs-23.jpg", yaw:0,
  hs:[[-25,150,"landing-3","3rd floor",0],[-40,-150,"landing-2","2nd floor",-20]]},
 {id:"landing-3", f:3, title:"3rd floor landing", img:"rh-landing-3.jpg", yaw:0,
  hs:[[-10,3,"room-3","Meeting room",0],[-40,103,"stairs-23","2nd floor",-150]]},
 {id:"room-3", f:3, title:"3rd floor meeting room", img:"rh-room-3.jpg", yaw:0,
  hs:[[-10,165,"landing-3","Stairs",0]]}
];
const byId = Object.fromEntries(STOPS.map(s=>[s.id,s]));
const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg>';
function goSpot(div, label){
  div.classList.add("go");
  div.innerHTML = arrow + '<span class="lbl"></span>';
  div.querySelector(".lbl").textContent = label;
  div.setAttribute("role","button"); div.setAttribute("aria-label", label);
}
const scenes = {};
STOPS.forEach(s=>{
  scenes[s.id] = { panorama:s.img, yaw:s.yaw, pitch:0,
    hotSpots: s.hs.map(([pitch,yaw,to,label,ty])=>({pitch,yaw,type:"scene",sceneId:to,targetYaw:ty,targetPitch:0,cssClass:"go",createTooltipFunc:goSpot,createTooltipArgs:label})) };
});
const hashId = location.hash.slice(1);
const startId = byId[hashId] ? hashId : "reception";
const viewer = pannellum.viewer("pano", {
  default:{ firstScene:startId, sceneFadeDuration:900, autoLoad:true, compass:false, hfov:105, minHfov:30, maxHfov:120 },
  scenes
});

const floorsEl = document.getElementById("floors"), stopsEl = document.getElementById("stops");
let shownFloor = -1;
FLOORS.forEach((name,i)=>{
  const b=document.createElement("button"); b.textContent=name; b.dataset.f=i;
  b.addEventListener("click",()=>{
    const first = STOPS.find(s=>s.f===i && !s.id.startsWith("stairs")) || STOPS.find(s=>s.f===i);
    showFloor(i);
    if (byId[viewer.getScene()].f !== i) viewer.loadScene(i===0 ? "reception" : first.id);
  });
  floorsEl.appendChild(b);
});
function showFloor(i){
  if (i===shownFloor) return; shownFloor=i;
  floorsEl.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.f===i)));
  stopsEl.innerHTML="";
  STOPS.filter(s=>s.f===i).forEach(s=>{
    const b=document.createElement("button"); b.dataset.id=s.id;
    b.innerHTML='<img alt="" src="data:image/jpeg;base64,'+THUMBS[s.id]+'"><span class="t"></span>';
    b.querySelector(".t").textContent=s.title;
    b.addEventListener("click",()=>{ if(viewer.getScene()!==s.id) viewer.loadScene(s.id); });
    stopsEl.appendChild(b);
  });
  mark(viewer ? viewer.getScene() : startId);
}
function mark(id){
  stopsEl.querySelectorAll("button").forEach(b=>b.setAttribute("aria-current", String(b.dataset.id===id)));
  const cur = stopsEl.querySelector('[aria-current="true"]'); if (cur) cur.scrollIntoView({block:"nearest",inline:"nearest"});
}
function onScene(id){
  const s=byId[id];
  document.getElementById("sceneTitle").textContent=s.title;
  document.getElementById("sceneNote").textContent="River House, Bexley · "+FLOORS[s.f];
  showFloor(s.f); mark(id);
}
showFloor(byId[startId].f); onScene(startId);
viewer.on("scenechange", onScene);
const hint=document.getElementById("hint");
["mousedown","touchstart"].forEach(ev=>viewer.on(ev,()=>hint.classList.add("gone")));
setTimeout(()=>hint.classList.add("gone"),7000);
</script>
</body>
</html>
